<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuber Trainer</title>

    <!-- 📌 Ícones e Identidade Visual do Projeto -->
    <link rel="icon" type="image/png" href="./imagens/icon.png">

    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#002b36">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CubeSpeed">

    <link rel="apple-touch-startup-image" href="./imagens/splash.png">
    <link rel="apple-touch-icon" href="./imagens/icon.png">
    
    <!-- Seus links de CSS anteriores continuam aqui abaixo... -->
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- 🎬 Tela Splash Inicial -->
    <div id="splash-screen">
        <img src="./imagens/splash.png" alt="Cuber Trainer Splash" class="splash-logo">
        <div class="splash-loader"></div>
    </div>

    <header>
        <div id="dashboard-summary"></div>
        <nav>
            <button data-screen="cases">Casos</button>
            <button data-screen="trainer">Treinar</button>
            <button data-screen="timer" class="active">Cronômetro</button>
            <button data-screen="history">Histórico</button>
        </nav>
    </header>

    <main id="app-container"></main>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
